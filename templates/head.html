<!DOCTYPE html>
<html>
  <head>
    <title>Index Page</title>

    <style>
      body {
        font-family: Sans;
      }

      main {
        max-width: 1024px;
        margin: auto;
      }

      #search {
        width: 100%;
        font-size: 1.05rem;
        padding: 12px 20px 12px 40px;
        border: 1px solid #ddd;
        margin-bottom: 12px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }


	  .button {
		  display: inline-block;
		  outline: none;
		  cursor: pointer;
		  padding: 0 16px;
		  background-color: #0070d2;
		  border-radius: 0.25rem;
		  border: 1px solid #0070d2;
		  color: #fff;
		  font-size: 13px;
		  line-height: 30px;
		  font-weight: 400;
		  text-align: center;
		  text-decoration: none;
	  }

	  .button:hover {
          background-color: #005fb2;  
          border-color: #005fb2;
      } 
      

      table {
        border-collapse: collapse;
        width: 100%;
        border: 1px solid #ddd;
        font-size: 18px;
      }

      table th,
      table td {
        text-align: left;
        padding: 12px;
      }

      table tr {
        border-bottom: 1px solid #ddd;
      }

      table tr.header,
      table tr:hover {
        background-color: #f1f1f1;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Auto Dealer</h1>
	  <div class="button-group">
		<a class="button" href="/">Dashboard</a>
		<a class="button" href="/Employees">Employees</a>
		<a class="button" href="/Inventory">Inventory</a>
		<a class="button" href="/Sales">Sales</a>
		<a class="button" href="/Users">Users</a>
	  </div>
